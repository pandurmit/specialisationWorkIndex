<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Boop Garden · play</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Baloo+2:wght@600;800&display=swap">
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/instrument.css">
  <script src="js/script.js" defer></script>
</head>
<body class="world-bell">

  <!-- Background scenery, just for fun (hidden from screen readers) -->
  <div class="scenery" aria-hidden="true">
    <div class="sun"></div>
    <div class="cloud cloud-1"></div>
    <div class="cloud cloud-2"></div>
    <div class="cloud cloud-3"></div>
    <div class="hill hill-back"></div>
    <div class="hill hill-front"></div>
  </div>

  <!-- Grown-up corner: small and in the corner. Press and hold to open. -->
  <header class="corner">
    <h1 class="visually-hidden">Boop Garden</h1>
    <button class="grownup" id="grownup" aria-label="Grown-up settings. Press and hold to open.">
      <svg viewBox="0 0 48 48" aria-hidden="true">
        <circle class="ring" cx="24" cy="24" r="21"/>
        <circle class="ring-fill" cx="24" cy="24" r="21" pathLength="100"/>
        <circle class="dot" cx="24" cy="24" r="6"/>
      </svg>
    </button>
  </header>

  <!-- The eight musical shapes, lowest note first -->
  <main class="stage">
    <div class="pads" role="group" aria-label="Musical shapes, from lowest note to highest">
      <button class="pad" data-note="0" aria-label="Red circle, note C">
        <svg viewBox="0 0 100 100" aria-hidden="true">
          <circle class="shape" cx="50" cy="52" r="44"/>
          <g class="face">
            <circle class="cheek" cx="28" cy="60" r="7"/>
            <circle class="cheek" cx="72" cy="60" r="7"/>
            <circle cx="38" cy="46" r="5.5"/>
            <circle cx="62" cy="46" r="5.5"/>
            <path class="smile" d="M39 60Q50 71 61 60"/>
            <ellipse class="open-mouth" cx="50" cy="64" rx="8" ry="9"/>
          </g>
        </svg>
      </button>
      <button class="pad" data-note="1" aria-label="Orange square, note D">
        <svg viewBox="0 0 100 100" aria-hidden="true">
          <rect class="shape" x="8" y="10" width="84" height="84" rx="18"/>
          <g class="face">
            <circle class="cheek" cx="28" cy="60" r="7"/>
            <circle class="cheek" cx="72" cy="60" r="7"/>
            <circle cx="38" cy="46" r="5.5"/>
            <circle cx="62" cy="46" r="5.5"/>
            <path class="smile" d="M39 60Q50 71 61 60"/>
            <ellipse class="open-mouth" cx="50" cy="64" rx="8" ry="9"/>
          </g>
        </svg>
      </button>
      <button class="pad" data-note="2" aria-label="Yellow triangle, note E">
        <svg viewBox="0 0 100 100" aria-hidden="true">
          <path class="shape" d="M50 6Q55 6 58 12L95 84Q98 93 88 93H12Q2 93 5 84L42 12Q45 6 50 6Z"/>
          <g class="face" transform="translate(50 70) scale(0.72) translate(-50 -52)">
            <circle class="cheek" cx="28" cy="60" r="7"/>
            <circle class="cheek" cx="72" cy="60" r="7"/>
            <circle cx="38" cy="46" r="5.5"/>
            <circle cx="62" cy="46" r="5.5"/>
            <path class="smile" d="M39 60Q50 71 61 60"/>
            <ellipse class="open-mouth" cx="50" cy="64" rx="8" ry="9"/>
          </g>
        </svg>
      </button>
      <button class="pad" data-note="3" aria-label="Green star, note G">
        <svg viewBox="0 0 100 100" aria-hidden="true">
          <path class="shape" d="M50 6L64.7 34.8L96.6 39.9L73.8 62.7L78.8 94.6L50 80L21.2 94.6L26.2 62.7L3.4 39.9L35.3 34.8Z"/>
          <g class="face" transform="translate(50 55) scale(0.62) translate(-50 -52)">
            <circle class="cheek" cx="28" cy="60" r="7"/>
            <circle class="cheek" cx="72" cy="60" r="7"/>
            <circle cx="38" cy="46" r="5.5"/>
            <circle cx="62" cy="46" r="5.5"/>
            <path class="smile" d="M39 60Q50 71 61 60"/>
            <ellipse class="open-mouth" cx="50" cy="64" rx="8" ry="9"/>
          </g>
        </svg>
      </button>
      <button class="pad" data-note="4" aria-label="Teal heart, note A">
        <svg viewBox="0 0 100 100" aria-hidden="true">
          <path class="shape" d="M50 92C22 72 4 56 6 34 8 16 32 6 50 26 68 6 92 16 94 34 96 56 78 72 50 92Z"/>
          <g class="face" transform="translate(50 46) scale(0.9) translate(-50 -52)">
            <circle class="cheek" cx="28" cy="60" r="7"/>
            <circle class="cheek" cx="72" cy="60" r="7"/>
            <circle cx="38" cy="46" r="5.5"/>
            <circle cx="62" cy="46" r="5.5"/>
            <path class="smile" d="M39 60Q50 71 61 60"/>
            <ellipse class="open-mouth" cx="50" cy="64" rx="8" ry="9"/>
          </g>
        </svg>
      </button>
      <button class="pad" data-note="5" aria-label="Blue hexagon, high note C">
        <svg viewBox="0 0 100 100" aria-hidden="true">
          <path class="shape" d="M50 5L90.7 28.5L90.7 75.5L50 99L9.3 75.5L9.3 28.5Z"/>
          <g class="face" transform="translate(50 52) scale(0.95) translate(-50 -52)">
            <circle class="cheek" cx="28" cy="60" r="7"/>
            <circle class="cheek" cx="72" cy="60" r="7"/>
            <circle cx="38" cy="46" r="5.5"/>
            <circle cx="62" cy="46" r="5.5"/>
            <path class="smile" d="M39 60Q50 71 61 60"/>
            <ellipse class="open-mouth" cx="50" cy="64" rx="8" ry="9"/>
          </g>
        </svg>
      </button>
      <button class="pad" data-note="6" aria-label="Purple diamond, high note D">
        <svg viewBox="0 0 100 100" aria-hidden="true">
          <path class="shape" d="M50 4L94 52L50 100L6 52Z"/>
          <g class="face" transform="translate(50 52) scale(0.78) translate(-50 -52)">
            <circle class="cheek" cx="28" cy="60" r="7"/>
            <circle class="cheek" cx="72" cy="60" r="7"/>
            <circle cx="38" cy="46" r="5.5"/>
            <circle cx="62" cy="46" r="5.5"/>
            <path class="smile" d="M39 60Q50 71 61 60"/>
            <ellipse class="open-mouth" cx="50" cy="64" rx="8" ry="9"/>
          </g>
        </svg>
      </button>
      <button class="pad" data-note="7" aria-label="Pink flower, high note E">
        <svg viewBox="0 0 100 100" aria-hidden="true">
          <path class="shape" d="M50 24A12.9 12.9 0 1 1 69.8 32.2A12.9 12.9 0 1 1 78 52A12.9 12.9 0 1 1 69.8 71.8A12.9 12.9 0 1 1 50 80A12.9 12.9 0 1 1 30.2 71.8A12.9 12.9 0 1 1 22 52A12.9 12.9 0 1 1 30.2 32.2A12.9 12.9 0 1 1 50 24Z"/>
          <g class="face" transform="translate(50 52) scale(0.85) translate(-50 -52)">
            <circle class="cheek" cx="28" cy="60" r="7"/>
            <circle class="cheek" cx="72" cy="60" r="7"/>
            <circle cx="38" cy="46" r="5.5"/>
            <circle cx="62" cy="46" r="5.5"/>
            <path class="smile" d="M39 60Q50 71 61 60"/>
            <ellipse class="open-mouth" cx="50" cy="64" rx="8" ry="9"/>
          </g>
        </svg>
      </button>
    </div>
  </main>

  <!-- Sound worlds: picture buttons, no reading needed -->
  <nav class="worlds" aria-label="Sound worlds">
    <button class="world" data-world="bell" aria-pressed="true" aria-label="Bell sounds">
      <svg viewBox="0 0 64 64" aria-hidden="true">
        <path d="M32 8c-11 0-17 9-17 19v11l-6 8h46l-6-8V27c0-10-6-19-17-19Z"/>
        <circle cx="32" cy="52" r="5"/>
      </svg>
    </button>
    <button class="world" data-world="bubble" aria-pressed="false" aria-label="Bubble sounds">
      <svg viewBox="0 0 64 64" aria-hidden="true">
        <circle cx="26" cy="38" r="16"/>
        <circle cx="47" cy="18" r="9"/>
        <circle cx="50" cy="44" r="5"/>
      </svg>
    </button>
    <button class="world" data-world="toot" aria-pressed="false" aria-label="Trumpet sounds">
      <svg viewBox="0 0 64 64" aria-hidden="true">
        <path d="M6 27h20l22-15v40L26 37H6Z"/>
        <rect x="14" y="37" width="8" height="10" rx="2"/>
      </svg>
    </button>
  </nav>

  <!-- Start screen: browsers need one tap before they allow sound -->
  <div class="start" id="start">
    <button class="start-button" id="startButton" aria-label="Start playing">
      <svg viewBox="0 0 100 100" aria-hidden="true">
        <circle cx="50" cy="50" r="44"/>
        <path d="M41 32 L70 50 L41 68 Z"/>
      </svg>
    </button>
  </div>

  <!-- Grown-up settings -->
  <dialog class="settings" id="settings">
    <form method="dialog">
      <h2>Grown-up corner</h2>

      <label for="volume">Volume</label>
      <input type="range" id="volume" min="0" max="1" step="0.1" value="0.7">

      <label class="toggle">
        <input type="checkbox" id="calm">
        Calm mode (no bouncing)
      </label>

      <p>Keys <kbd>A</kbd> to <kbd>K</kbd> play the shapes from low to high. Any other key plays a surprise note.</p>

      <p><a href="../index.html">About this project</a> · <a href="../docs.html">How it works</a></p>

      <button class="close">Back to playing</button>
    </form>
  </dialog>
</body>
</html>
